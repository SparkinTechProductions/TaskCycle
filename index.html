<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Cycle App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
    <div id="title">Task Cycle</div>
    <div id="version">Version 1.0</div>
    <div class="center-container">
        <div id="checkbox-list"></div>
        <input type="text" id="new-checkbox-label" placeholder="Enter name for task." />
        <div id="divider"></div>
        <div id="progress-bar-container">
            <div id="progress-bar"></div>
        </div>
        <div id="complete-message">COMPLETE</div>
        <div id="button-container">
                <button id="add-button">+</button>
            
            <button id="complete-button">COMPLETE</button>
                <button id="delete-button" class="blue">🗑️</button>
                    <button id="rename-button" class="hidden">✏️</button>
                </div>
                <div id="tooltip-container">
  <!-- Tooltip for Add Button -->
  <div id="add-button-tooltip" class="tooltip-text"></div>
   <!-- Tooltip for Complete Button -->
  <div id="complete-button-tooltip" class="tooltip-text"></div>
  <!-- Error Message for Complete Button -->
  <div id="error-message" class="tooltip-text"></div>          
                </div>

            </div>
            <div id="contextMenu" class="hidden">
                <div id="renameOption">Rename</div>
                <div id="deleteOption">Delete</div>
            </div>
        </div>
<div id="bottom-container">
    <div id="counter-container" class="hidden">
        <div id="counter">0</div>
        <button id="reset-button">Reset</button>
    </div>
    <div id="button-timer-container">
      <button id="timer-toggle-button">Timer</button>
    </div>
    <div id="timer-container" class="hidden">
        <div id="timer">0:00:00</div>
        <button id="start-button">Start</button>
        <button id="stop-button">Stop</button>
        <button id="reset-timer-button">Reset</button>
    </div>
</div>
<div id="popup-message" class="hidden">Must check off an item to COMPLETE</div>
<script src="scripts.js"></script>
</body>
</html>
