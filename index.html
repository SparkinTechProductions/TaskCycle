<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Cycle App</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


</head>
<body>
     <!-- Startup Page -->
     <div id="startup-page" class="hidden">
        <h1>Welcome to Task Cycle</h1>
        <button id="new-cycle-button">Create New Task Cycle</button>
        <button id="load-cycle-button">Load Saved Task Cycle</button>
    </div>
    <div id="entry-modal" class="hidden">
        <div class="modal-content">
            <span class="close">&times;</span>
            <button class="prev">&#10094;</button>
            <div class="entry-text"></div>
            <button class="next">&#10095;</button>
        </div>
    </div>
    
<div id="app">
   <!-- Main Menu Button -->
<button id="main-menu-button">☰</button>

<!-- Main Menu Panel -->
<div id="menu-panel" class="hidden">
    <h3>Menu</h3>
    <ul>
        <li><button id="new-cycle">New</button></li>
        <li><button id="load-cycle">Open</button></li>
        <li><button id="save-cycle">Save</button></li>
        <li><button id="save-as-cycle">Save As</button></li>
        <li><button id="clear-tasks">Clear All</button></li>
        <li><button id="open-settings">Settings</button></li>
    </ul>
</div>

    <!-- Settings Menu -->
    <div id="settings-menu" class="hidden">
        <h3>Settings</h3>
        <ul>
            <li>
                <div id="pro-toggle-container">
                    <label class="switch">
                        <input type="checkbox" id="pro-version-toggle" />
                        <span class="slider round"></span>
                    </label>
                    <span id="pro-version-label">Switch to Pro</span>
                </div>
                
            </li>
            <li>
                <button id="close-settings">Close Settings</button>
            </li>
        </ul>
    </div>
    
    <div id="title">Task Cycle</div>
    <div id="version">Version 1.0</div>
    <div class="center-container">
        <div id="checkbox-list"></div>
        
        <div id="divider"></div>
        <div id="progress-bar-container">
            <div id="progress-bar"></div>
        </div>
        <div id="complete-message">CYCLE COMPLETE</div>
        <input type="text" id="new-checkbox-label" placeholder="Enter name for task." />
        <div id="button-container">
                <button id="add-button">+</button>
            
            <button id="complete-button">COMPLETE</button>
                </div>
                
                <div id="tooltip-container">
                   <br>
  <!-- Tooltip for Add Button -->
  <div id="add-button-tooltip" class="tooltip-text"></div>
  <!-- Tooltip for Notes Button -->
  <div id="notes-button-tooltip" class="tooltip-text"></div>
  <!-- Tooltip for Chart Button -->
  <div id="stats-button-tooltip" class="tooltip-text"></div>
    <!-- Tooltip for Main Menu Button -->
    <div id="main-menu-button-tooltip" class="tooltip-text"></div>
   <!-- Tooltip for Complete Button -->
  <div id="complete-button-tooltip" class="tooltip-text"></div>
 <!-- Tooltip for Tasks -->
 <div id="task-tooltip" class="tooltip-text"></div>
  <!-- Error Message for Complete Button -->
  <div id="error-message" class="tooltip-text"></div> 
  

                </div>

            </div>
            <div id="contextMenu" class="context-sensitive-menu">
                <div id="renameOption">Rename</div>
                <div id="deleteOption">Delete</div>
            </div>
        </div>
        <div id="horizontalMenu" style="display: none;" class="context-sensitive-menu">
            <button id="menuDetails">Details</button>
            <button id="menuRename">Rename</button>
            <button id="menuDelete">Delete</button>
            <button id="menuRearrange" style="display: none;">Rearrange</button> 
            <button id="menuMark">Mark</button>
            <button id="menuSubtasks">Subtasks</button>
            
            <!--<button id="menuSubtask">Subtask</button> -->

        <div id="priorityMenu" class="hidden">
            <button id="markHigh">Mark as High Priority</button>
            <button id="markLow">Mark as Low Priority</button>
        </div>

        </div>
        <div id="detailsModalBackdrop" class="hidden">
            <div id="detailsModal">
                <textarea id="detailsTextarea" disabled placeholder="Press Edit to Enter Task Details Here"></textarea>
                <button id="editDetailsButton">Edit</button>
            </div>
        </div>
        
<div id="bottom-container">
    <div id="button-timer-container">
      <button id="timer-toggle-button">Timer</button>
    </div>
    
    <div id="timer-container" class="hidden">
        <div id="timer">0:00:00</div>
        <button id="start-button">Start</button>
        <button id="stop-button">Stop</button>
        <button id="reset-timer-button">Reset</button>
    </div>
    <div id="counter-container" class="hidden">
        <div id="counter">0</div>
        <button id="reset-button">Reset</button>
    </div> 
</div>


<!-- Notes Button -->
<button id="notes-button">📝</button>

<!-- Notes Panel (initially hidden) -->
<div id="notes-panel" class="hidden">
    <div id="notes-list"></div>
    <textarea id="new-note-textarea" placeholder="Add a new note..."></textarea>
    <button id="add-note">Add Note</button>
    <button id="close-notes">Close</button>

</div>

<button id="chart-button">📈</button> <!-- Chart icon button -->
<div id="stats-window" class="hidden">
    <button id="view-timeline-button">View Timeline</button> <!-- New Button -->
    <button id="close-timeline-button">Close Timeline</button>
    <div id="timeline">
        <div id="timeline-content">
            <!-- Timeline content goes here -->
        </div>
        <button id="clear-timeline-button" class="hidden">Clear All Entries</button>
    </div>
    <div id="tasks-overview">
    <div id="stats-content-tasks"></div>
    <div id="chart-area-pie">
        <div id="pie-chart-container">
            <canvas id="stats-chart"></canvas>
        </div>
    </div>
    </div>
    <div id="subtasks-overview">
    <div id="stats-content-subtasks" class="hidden"></div>
     <div id="chart-area-bar">
        <div id="bar-chart-container">
          <canvas id="bar-chart"></canvas>
        </div>
      </div>
    </div>
      <div id="completion-percentage" style="text-align: center; font-size: 18px; margin-top: 10px;"></div>
      <div id="stats-content-taskcycles"></div>    
    <button id="close-stats">Close</button>
</div>

<div id="popup-message" class="hidden">Must check off an item to COMPLETE</div>
<br>
<footer>&copy; 2024 Task Cycle</footer>
<script src="scripts.js"></script>
</body>
</html>
