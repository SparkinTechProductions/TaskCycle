<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Task Cycle | Mini Cycle</title>
    <link rel="icon" type="image/png" href="assets/images/logo/taskcycle_logo_blackandwhite_transparent.png" />
    <link rel="stylesheet" href="miniCycle-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

</head>
<body>

    <button class="menu-button">☰</button>
    <div class="menu-container">

        <ul>
            <li><button id="new-mini-cycle"><i class="fas fa-plus"></i> Create New Mini Cycle</button></li>
            <li><button id="open-mini-cycle"><i class="fas fa-folder-open"></i> Open Saved Mini Cycle</button></li>
            <!--<li><button id="save-mini-cycle"><i class="fas fa-save"></i> Save</button></li>-->
            <li><button id="save-as-mini-cycle"><i class="fas fa-copy"></i> Save As</button></li>
            <li><button id="clear-mini-cycle-tasks"><i class="fas fa-eraser"></i> Clear All Tasks</button></li>
            <li><button id="delete-all-mini-cycle-tasks"><i class="fas fa-trash"></i> Delete All Tasks</button></li>
            <li><button id="open-settings"><i class="fas fa-cog"></i> Settings</button></li>
            <li><button id="exit-mini-cycle"><i class="fas fa-sign-out-alt"></i> Exit Mini Cycle</button></li>
           </ul>
           <label>
            <label class="switch">
            <input type="checkbox" id="toggleAutoReset">
            <span class="slider round"></span>
        </label> 
             Auto Reset
        </label>
    </div>

    
<app>
 

    <h1 class="title-container">
    
        <div class="title-text">
            <a href="#home" class="logo">
                <img src="assets/images/logo/taskcycle_logo_blackandwhite_transparent.png" alt="Task Cycle Logo" />
            </a>
            <logo id="app_name">
                <img src="assets/images/logo/App_Name_tp_bw.png" alt="App Name" />
              </logo>   
            <div class="tagline">Mini Cycle | To-Do List </div>
        </div>
    </h1>
    
<!-- Task List & Stats Wrapper -->
<div id="app-container">
    <!-- Left Arrow for Task View -->
<div id="slide-left" class="slide-arrow">❯</div>

<!-- Right Arrow for Stats Panel -->
<div id="slide-right" class="slide-arrow">❮</div>

    <div id="task-view">
        <div class="task-input">
            <input type="text" id="taskInput" placeholder="Enter a task...">
            <button id="addTask">Add</button>
        </div>
        <div class="task-list-container">
            <!--Tasks will go here-->
            <ul id="taskList" class="task-list"></ul>
        </div>
        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        <button id="completeAll" class="complete-all-btn">Complete</button>
        <p id="cycleMessage">✅ Cycle Complete! Tasks reset.</p>
    </div>

    <!-- Stats Panel (Initially Hidden) -->
    <div id="stats-panel">
        <h2>📊 Stats</h2>
        <p><strong>Total Tasks:</strong> <span id="total-tasks">0</span></p>
        <p><strong>Completed Tasks:</strong> <span id="completed-tasks">0</span></p>
        <p><strong>Completion Rate:</strong> <span id="completion-rate">0%</span></p>
        <p><strong>Mini Cycles Completed:</strong> <span id="mini-cycle-count">0</span></p> <!-- ✅ New Line -->
        <div class="progress-container">
            <div id="stats-progress-bar" class="progress-bar"></div>
        </div>
    </div>
    
</div>

    
    </app>
<div>
    <footer id="footer-container">
        <p id="copyright">
          © 2025 Sparkin Creations
        </p>
        </footer>
</div>


    <script src="miniCycle-scripts.js"></script>
</body>
</html>
