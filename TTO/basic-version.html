<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Cycle - Demo Version</title>
    <style>
        /* Global Styles */
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #4c79ff, #74c0fc);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            justify-content: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        /* Task Input Section */
        .task-input {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 8px;
            padding: 5px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
            margin-bottom: 15px;
        }

        input[type="text"] {
            flex: 1;
            background: white;
            padding: 10px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            outline: none;
        }

        button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #ff4d4d;
        }

            /* Complete All Button */
        .complete-all-btn {
            background: #00C851;
            margin-top: 10px;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s;
            display: none; /* Initially hidden */
        }

        .complete-all-btn:hover {
            background: #009c41;
        }



 /* Task List Container */
 .task-list-container {
        max-width: 400px;
        width: 100%;
        max-height: 350px;/* Set a fixed height */
        overflow-y: auto; /* Enable vertical scrolling */
        background: rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        padding: 10px;
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.2);
    }
    .task-list-container::-webkit-scrollbar {
    width: 8px;
}

.task-list-container::-webkit-scrollbar-thumb {
    background-color: rgba(255, 255, 255, 0.6);
    border-radius: 10px;
}

.task-list-container::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.1);
}

    /* Task List */
    .task-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    /* Hide scrollbar on WebKit browsers */
    .task-list-container::-webkit-scrollbar {
        width: 6px;
    }

    .task-list-container::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.4);
        border-radius: 10px;
    }

    .task-list-container::-webkit-scrollbar-track {
        background: transparent;
    }

        .task {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 12px;
            border-radius: 8px;
            margin: 6px 0;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
            color: #333;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            position: relative;
        }

        .task:hover {
            transform: scale(1.02);
            background: #f8f9fa;
        }

        .task input {
            margin-right: 10px;
            cursor: pointer;
        }

        .task span {
        flex: 1;
        text-align: left;
        font-size: 16px;
        max-width: calc(100% - 180px);
        white-space: pre-wrap;
        word-wrap: break-word; 
        margin-right: 150px;
    }

        /* Task Actions */
        .task-actions {
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
            position: absolute;
            right: 10px;
        }

        .task:hover .task-actions {
            opacity: 1;
        }

        .action-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.2s;
        }


        /* Hide default checkbox */
.task input[type="checkbox"] {
    appearance: none;
    width: 22px;
    height: 22px;
    aspect-ratio: 1/1;  /* Ensures a perfect circle */
    border-radius: 50%;
    border: 2px solid #ccc;
    background-color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    outline: none;
    box-sizing: border-box; /* Prevents unwanted resizing */
    transition: all 0.3s ease;
}

/* Hover Effect */
.task input[type="checkbox"]:hover {
    border-color: #4c79ff;
}

/* Checked State */
.task input[type="checkbox"]:checked {
    background-color: #4c79ff; /* Light blue background */
    border-color: #4c79ff;
}

/* Add a checkmark */
.task input[type="checkbox"]::after {
    content: "✔";
    font-size: 14px;
    color: white;
    font-weight: bold;
    display: none;
}

/* Show checkmark when checked */
.task input[type="checkbox"]:checked::after {
    display: block;
}


        .rename-btn { color: #ffa502; } /* Rename - Orange */
        .rename-btn:hover { color: #ff7f00; }

        .delete-btn { color: #ff6b6b; } /* Delete - Red */
        .delete-btn:hover { color: #ff4d4d; }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 10px;
            height: 12px;
            margin-top: 15px;
            box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #00C851;
            transition: width 0.3s ease-in-out;
        }

        /* Cycle Complete Message */
        #cycleMessage {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
            display: none;
            animation: fadeInOut 2s;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>Task Cycle 🚀</h1>
    <div class="task-input">
        <input type="text" id="taskInput" placeholder="Enter a task...">
        <button id="addTask">Add</button>
    </div>
    <div class="task-list-container">
        <ul id="taskList" class="task-list"></ul>
    </div>
    <div class="progress-container">
        <div id="progressBar" class="progress-bar"></div>
    </div>
    <button id="completeAll" class="complete-all-btn">Complete</button>
    <p id="cycleMessage">✅ Cycle Complete! Tasks reset.</p>
  

    <script>
        const taskInput = document.getElementById("taskInput");
        const addTaskButton = document.getElementById("addTask");
        const taskList = document.getElementById("taskList");
        const cycleMessage = document.getElementById("cycleMessage");
        const progressBar = document.getElementById("progressBar");
        const completeAllButton = document.getElementById("completeAll");
        const TASK_LIMIT = 50; // Character limit

        function saveTasks() {
            const tasks = [...taskList.children].map(task => ({
                text: task.querySelector("span").textContent,
                completed: task.querySelector("input").checked
            }));
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        function loadTasks() {
            const savedTasks = JSON.parse(localStorage.getItem("tasks")) || [];
            taskList.innerHTML = "";
            savedTasks.forEach(task => addTask(task.text, task.completed, false));
            updateProgressBar();
        }





        function updateProgressBar() {
            const totalTasks = taskList.children.length;
            const completedTasks = [...taskList.children].filter(task => task.querySelector("input").checked).length;
            const progress = totalTasks > 0 ? (completedTasks / totalTasks) * 100 : 0;
            progressBar.style.width = `${progress}%`;
            saveTasks();

        }

        function checkTaskCycle() {
            updateProgressBar();
            const allCompleted = [...taskList.children].every(task => task.querySelector("input").checked);
            if (allCompleted && taskList.children.length > 0) {
                setTimeout(resetTasks, 1000);
            }
            saveTasks();

        }

        function addTask() {
    let taskText = taskInput.value.trim();
    if (!taskText) return;
    if (taskText.length > TASK_LIMIT) {
        alert(`Task must be ${TASK_LIMIT} characters or less.`);
        return;
    }

    const li = document.createElement("li");
    li.classList.add("task");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.addEventListener("change", checkTaskCycle);

    const label = document.createElement("span");
    label.textContent = taskText;

    // ✅ Make label clickable to toggle checkbox ✅
    label.addEventListener("click", () => {
        checkbox.checked = !checkbox.checked;
        checkTaskCycle(); // Ensure the progress updates
        saveTasks();
    });

    const taskActions = document.createElement("div");
    taskActions.classList.add("task-actions");

    const renameBtn = document.createElement("button");
    renameBtn.innerHTML = "✏️";
    renameBtn.classList.add("action-btn", "rename-btn");
    renameBtn.addEventListener("click", () => renameTask(label));

    const deleteBtn = document.createElement("button");
    deleteBtn.innerHTML = "🗑️";
    deleteBtn.classList.add("action-btn", "delete-btn");
    deleteBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        li.remove();
        updateProgressBar();
        saveTasks();
    });

    taskActions.appendChild(renameBtn);
    taskActions.appendChild(deleteBtn);
    li.appendChild(checkbox);
    li.appendChild(label);
    li.appendChild(taskActions);
    taskList.appendChild(li);
    taskInput.value = "";

    // 🔽 Scroll smoothly to the latest task
    document.querySelector(".task-list-container").scrollTo({
        top: taskList.scrollHeight,
        behavior: "smooth"
    });

    updateProgressBar();
    if (shouldSave) saveTasks();
    completeAllButton.style.display = "block"; 
}


        function renameTask(label) {
            const newName = prompt(`Rename Task (Max ${TASK_LIMIT} chars):`, label.textContent);
            if (newName !== null && newName.trim() !== "" && newName.length <= TASK_LIMIT) {
                label.textContent = newName.trim();
                saveTasks();
            } else if (newName.length > TASK_LIMIT) {
                alert(`Task name cannot exceed ${TASK_LIMIT} characters.`);
            }
        }

        function resetTasks() {
            taskList.querySelectorAll(".task input").forEach(task => task.checked = false);
            cycleMessage.style.display = "block";
            progressBar.style.width = "0%";
            setTimeout(() => cycleMessage.style.display = "none", 2000);
        }

        addTaskButton.addEventListener("click", addTask);
        taskInput.addEventListener("keypress", event => {
            if (event.key === "Enter") addTask();
        });
        window.onload = loadTasks;
        window.onload = () => taskInput.focus();


        completeAllButton.addEventListener("click", () => {
            taskList.querySelectorAll(".task input").forEach(task => task.checked = true);
            checkTaskCycle();
        });

    </script>
</body>
</html>
